[project]
id = "cellar"
version = "0.4.0"
mach = "^6.7.2"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the simulation's and the cell renderer's shaders, built for the oldest vulkan
# environment boom runs on
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.0"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[artifact.cellar]
default = true
kind = "bin"
entry = "bin/cellar.mach"
out = "bin/cellar{artifact.suffix}"
targets = ["linux-x86_64", "linux-aarch64", "windows-x86_64", "darwin-x86_64", "darwin-aarch64"]
link = []
# the embeds name the stage artifacts, so requiring them builds the modules
# before the program that carries them
need = ["artifact.stage-*"]

[artifact.stage-weighted_comp]
kind = "bin"
entry = "bin/shaders/weighted_comp.mach"
out = "spv/weighted_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-generations_comp]
kind = "bin"
entry = "bin/shaders/generations_comp.mach"
out = "spv/generations_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-clear_comp]
kind = "bin"
entry = "bin/shaders/clear_comp.mach"
out = "spv/clear_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-grow_comp]
kind = "bin"
entry = "bin/shaders/grow_comp.mach"
out = "spv/grow_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-census_comp]
kind = "bin"
entry = "bin/shaders/census_comp.mach"
out = "spv/census_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-reduce_comp]
kind = "bin"
entry = "bin/shaders/reduce_comp.mach"
out = "spv/reduce_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-cells_vert]
kind = "bin"
entry = "bin/shaders/cells_vert.mach"
out = "spv/cells_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-cells_frag]
kind = "bin"
entry = "bin/shaders/cells_frag.mach"
out = "spv/cells_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^9.4.1"

[dep.boom]
git = "https://github.com/briar-systems/boom"
version = "^0.38.0"

[dep.image]
git = "https://github.com/briar-systems/mach-image"
version = "^0.8.0"
