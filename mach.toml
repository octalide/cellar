[project]
id = "cellar"
version = "0.11.0"
mach = "^6.10.1"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-aarch64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows-x86_64]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# the simulation's and the cell renderer's shaders: vulkan 1.2 with buffer
# device addresses, which they reach the pool's shards through (cellar.layout)
[target.spirv]
isa        = "spirv"
os         = "freestanding"
abi        = "spirv"
env        = "vulkan1.2"
extensions = ["buffer_device_address"]

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[artifact.cellar]
default = true
kind = "bin"
entry = "bin/cellar.mach"
out = "bin/cellar{artifact.suffix}"
targets = ["linux-x86_64", "linux-aarch64", "windows-x86_64", "darwin-x86_64", "darwin-aarch64"]
link = []
# the embeds name the stage artifacts, so requiring them builds the modules
# before the program that carries them
need = ["artifact.stage-*"]

[artifact.stage-weighted_comp]
kind = "bin"
entry = "bin/shaders/weighted_comp.mach"
out = "spv/weighted_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

