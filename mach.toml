[project]
id = "cellar"
version = "0.13.2"
mach = "^7"
src  = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
abi  = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys  = "linux"
abi  = "aapcs64"

[target.windows-x86_64]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

# the simulation's and the cell renderer's shaders: vulkan 1.2 with buffer
# device addresses, which they reach the pool's shards through (cellar.layout)
[target.spirv]
arch = "spirv"
sys  = "vulkan"
abi  = "shader"
env  = "vulkan1.2"
ext  = ["PhysicalStorageBufferAddresses"]

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.cellar]
default = true
kind = "bin"
entry = "bin/cellar.mach"
out = "{project.work}/bin/cellar{artifact.suffix}"
targets = ["linux-x86_64", "linux-aarch64", "windows-x86_64", "darwin-x86_64", "darwin-aarch64"]
link = []
# the embeds name the stage artifacts, so requiring them builds the modules
# before the program that carries them
need = ["artifact.stage-*"]

[artifact.stage-weighted_comp]
kind = "module"
entry = "bin/shaders/weighted_comp.mach"
out = "{project.work}/spv/weighted_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

