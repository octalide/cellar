name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runners:
        description: runners to test on, as a JSON array, e.g. ["macos-15", "windows-latest"]
        type: string
  workflow_call:
    inputs:
      runners:
        type: string
      profile:
        type: string
        default: debug

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MACH_VERSION: 6.9.0
  PROFILE: ${{ inputs.profile || 'debug' }}

jobs:
  # every runner builds every artifact for its own target and tests it
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: install mach
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/mach"
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
          else
            curl -fsSL "$url/install.sh" | sh
          fi
          echo "$MACH_INSTALL_DIR" >> "$GITHUB_PATH"
      # mach-glfw builds GLFW from source: x11 and wayland headers on linux, zig on windows
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-bin libwayland-dev libxkbcommon-dev wayland-protocols
      - if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - run: mach dep pull .
      - if: strategy.job-index == 0
        run: mach fmt --check .
      # glfw's C step cannot cross-build darwin (the Apple SDK) or link linux
      # arm64 from another host, so each runner builds its own target. glfw's
      # darwin archive is PIC, so a darwin executable linking it is PIE
      - run: mach test . -a '*' -p "$PROFILE" ${{ runner.os == 'macOS' && '--pie' || '' }}

  gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
