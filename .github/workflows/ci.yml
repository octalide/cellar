name: CI

# the family's tiered pipeline (briar-systems/.github mach-lib.yml). a pull
# request into dev runs the linux leg, a pull request into main runs every
# leg. mach-glfw builds GLFW from C with each host's own toolchain, so every
# target is built natively on its own leg rather than cross-built from linux,
# and .github/ci/setup.sh installs what a leg's C step needs. nothing runs on
# push. cd.yml calls this with heavy: all.

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, x86_64-windows, x86_64-darwin, aarch64-darwin]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      mach-version: v6.7.2
      # the windows and darwin targets need their own host's C toolchain for
      # glfw, so the legs below build them instead
      all-targets: false
      # the linux leg builds GLFW's x11 and wayland backends from source; a
      # mach-o image on either darwin silicon is position independent
      legs: >-
        [{"name": "x86_64-linux", "runs-on": "ubuntu-latest", "target": "linux-x86_64",
          "apt": ["xorg-dev", "libwayland-bin", "libwayland-dev", "libxkbcommon-dev",
                  "wayland-protocols"]},
         {"name": "x86_64-windows", "runs-on": "windows-latest", "tier": "heavy",
          "target": "windows-x86_64"},
         {"name": "x86_64-darwin", "runs-on": "macos-15-intel", "tier": "heavy",
          "target": "darwin-x86_64", "build-args": ["--pie"], "test-args": ["--pie"]},
         {"name": "aarch64-darwin", "runs-on": "macos-15", "tier": "heavy",
          "target": "darwin-aarch64", "build-args": ["--pie"], "test-args": ["--pie"]}]

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
