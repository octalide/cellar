name: Release

# the family's shared release (briar-systems/.github mach-release.yml): a pushed
# v* tag is verified against mach.toml and the changelog, runs the full CI with
# heavy: all, builds a release binary natively on each supported host, and
# publishes them with SHA256SUMS. a workflow_dispatch rehearses the same path
# and deletes its draft.
#
# asset names:
#   cellar-<version>-<platform>.tar.gz   (linux, darwin)
#   cellar-<version>-<platform>.zip      (windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# one run per tag: GitHub can deliver a tag push twice, and two runs reaching
# publish leaves an orphan draft. the second waits, finds the release, and ends
# green. never cancel, since that could abort a publish part way
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    with:
      stage: verify
      assets: >-
        ["cellar-{version}-x86_64-linux.tar.gz", "cellar-{version}-x86_64-windows.zip",
         "cellar-{version}-x86_64-darwin.tar.gz", "cellar-{version}-aarch64-darwin.tar.gz"]

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      heavy: all

  # each binary is built and run on its own host: GLFW's C step needs that
  # host's toolchain, the version check executes the binary, and a darwin lane
  # on the wrong silicon would ship a translated build
  build:
    name: build ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: x86_64-linux,   target: linux-x86_64,   runs-on: ubuntu-latest }
          - { asset: x86_64-windows, target: windows-x86_64, runs-on: windows-latest }
          - { asset: x86_64-darwin,  target: darwin-x86_64,  runs-on: macos-15-intel, machine: x86_64, args: --pie }
          - { asset: aarch64-darwin, target: darwin-aarch64, runs-on: macos-15,       machine: arm64,  args: --pie }
    env:
      MACH_CI_LEG: ${{ matrix.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: the darwin lane landed on real silicon
        if: runner.os == 'macOS'
        env:
          WANT: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          got=$(uname -m); translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
          [ "$got" = "$WANT" ] && [ "$translated" = 0 ] || { echo "::error::the $WANT lane landed on a $got host (proc_translated=$translated)"; exit 1; }

      - name: glfw build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-bin libwayland-dev libxkbcommon-dev wayland-protocols

      - name: host toolchain
        run: bash .github/ci/setup.sh

      - name: seed
        uses: briar-systems/.github/.github/actions/seed-mach@main
        with:
          tag: v6.7.1

      - name: release build
        env:
          TARGET: ${{ matrix.target }}
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          mach dep pull .
          mach build . --target "$TARGET" --profile release $ARGS

      - name: the binary reports this version
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          got="$("out/$TARGET/release/bin/cellar$exe" --version | tr -d '\r')"
          [ "$got" = "cellar $VERSION" ] || { echo "::error::cellar --version printed '$got', expected 'cellar $VERSION'"; exit 1; }

      - name: package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist pkg
          cp LICENSE README.md pkg/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "out/$TARGET/release/bin/cellar.exe" pkg/cellar.exe
            (cd pkg && 7z a -tzip "../dist/cellar-$VERSION-$ASSET.zip" cellar.exe LICENSE README.md >/dev/null)
          else
            cp "out/$TARGET/release/bin/cellar" pkg/cellar
            tar -C pkg -czf "dist/cellar-$VERSION-$ASSET.tar.gz" cellar LICENSE README.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/cellar-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, ci, build]
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    permissions:
      contents: write
    with:
      stage: publish
      assets: >-
        ["cellar-{version}-x86_64-linux.tar.gz", "cellar-{version}-x86_64-windows.zip",
         "cellar-{version}-x86_64-darwin.tar.gz", "cellar-{version}-aarch64-darwin.tar.gz"]
