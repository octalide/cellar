name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MACH_VERSION: 6.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mach.toml", "rb"))["project"]["version"])')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match mach.toml version $version"; exit 1; }

  # the hosts this project ships to, tested natively before anything is published
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      profile: release
      runners: '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-15", "macos-15-intel"]'

  # the binary, built natively on each host it ships to: mach-glfw cannot cross-build darwin
  # or link linux arm64 from another host
  package:
    needs: verify
    name: package (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-15", "macos-15-intel"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: install mach
        run: |
          export MACH_INSTALL_DIR="$RUNNER_TEMP/mach"
          url="https://raw.githubusercontent.com/briar-systems/mach/v$MACH_VERSION/dist"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm $url/install.ps1 | iex"
          else
            curl -fsSL "$url/install.sh" | sh
          fi
          echo "$MACH_INSTALL_DIR" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-bin libwayland-dev libxkbcommon-dev wayland-protocols
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "zig-x86_64-windows-0.16.0"
          Invoke-WebRequest "https://ziglang.org/download/0.16.0/$name.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$name" >> $env:GITHUB_PATH
      - run: mach dep pull .
      - env:
          PIE: ${{ runner.os == 'macOS' && '--pie' || '' }}
        run: |
          # shellcheck disable=SC2086
          mach build . -a cellar -p release $PIE
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          # shellcheck disable=SC2086
          mach build . -a cellar -p release $PIE --plan | awk '
            /^unit / { name = $3; target = $6 }
            $1 == "tuple" { split($2, t, "-"); os = t[2] }
            $1 == "out" && name == "cellar" { print name, target, os, $2 }' |
          while read -r name target os path; do
            archive="$PWD/dist/$name-$version-$target"
            case "$os" in
              windows) (cd "$(dirname "$path")" && 7z a -tzip -bso0 "$(cygpath -w "$archive.zip")" "$(basename "$path")") ;;
              *)       tar -czf "$archive.tar.gz" -C "$(dirname "$path")" "$(basename "$path")" ;;
            esac
          done
          ls dist
          [ -n "$(ls dist)" ] || { echo "::error::no cellar archive for this host"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # a doubled tag push waits on the concurrency group, then finds the release
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # notes are the changelog section for this version when there is one
          notes=$(awk -v v="${TAG#v}" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md 2>/dev/null || true)
          flags=(--verify-tag --title "$TAG" --draft)
          [ -n "$notes" ] && flags+=(--notes "$notes") || flags+=(--generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${flags[@]}"
          gh release edit "$TAG" --draft=false
